services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: matchday-world-cup-jersey-store:1.0.0
    container_name: matchday-world-cup-jersey-store
    ports:
      - "${STORE_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
    volumes:
      - matchday_store_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  matchday_store_data:
    name: matchday-world-cup-jersey-store-data
